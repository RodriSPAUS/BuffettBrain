name: wiki lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No dependencies: the checks are stdlib-only by design, so they run
      # anywhere and cannot rot.
      # Fails only when a change introduces errors a file did not already have.
      # The remaining backlog lives in scripts/baseline.json and shrinks as the
      # older summaries are rewritten.
      - name: Run wiki checks
        run: make lint
